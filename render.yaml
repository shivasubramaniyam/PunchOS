services:
  # 1. Express Backend Server
  - type: web
    name: punchos-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma db push && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: punchos-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: PORT
        value: 8000

databases:
  # Free PostgreSQL Database on Render
  - name: punchos-db
    plan: free
    databaseName: punchos
    user: punchos
